[project]
name = "voc-mcp"
version = "0.1.1"
description = "MCP server and Agent Skill to turn customer reviews, verbatims and call transcripts into an actionable Voice-of-the-Customer diagnosis."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "CustoVox.ai" }]
requires-python = ">=3.10"
keywords = ["mcp", "voice-of-customer", "customer-experience", "agent-skills", "claude-code"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Natural Language :: French",
    "Natural Language :: English",
    "Topic :: Office/Business",
]
dependencies = [
    "fastmcp>=4.1,<5",   # MCP server framework
    "openpyxl>=3.1",      # .xlsx reading
]

[project.optional-dependencies]
# Optional speech-to-text with diarisation (heavy: installs PyTorch).
audio = ["funasr>=1.2", "torch", "torchaudio"]
dev = ["pytest>=8"]

[project.scripts]
voc-mcp = "voc_mcp.server:main"

[project.urls]
Homepage = "https://github.com/custovox/voc-skill"
Issues = "https://github.com/custovox/voc-skill/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voc_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
